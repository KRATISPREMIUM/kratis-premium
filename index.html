<script>
// SINGLE CORRECT VERSION - NO DUPLICATES
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
  const t=document.getElementById('page-'+name);
  if(t) t.classList.remove('hidden');
  const travel=document.getElementById('logoTravel');
  const estate=document.getElementById('logoEstate');
  if(travel && estate){
    if(name==='estate'||name==='estate-list'||name==='blogs'){
      travel.classList.add('hidden'); travel.classList.remove('flex');
      estate.classList.remove('hidden'); estate.classList.add('flex');
    }else{
      estate.classList.add('hidden'); estate.classList.remove('flex');
      travel.classList.remove('hidden'); travel.classList.add('flex');
    }
  }
  window.scrollTo(0,0);
}
function showDataSection(sec){
  const idMap={
    'dashboard':'dataDashboard','wallet':'dataWallet','mtn':'dataMTN',
    'airtel':'dataAirtel','airteltigo':'dataAirtel','telecel':'dataTelecel',
    'afa':'dataAFA','vouchers':'dataVouchers'
  };
  const key=sec.toLowerCase().replace(/\s+/g,'');
  const targetId=idMap[sec] || idMap[key] || 'dataDashboard';
  ['dataDashboard','dataWallet','dataMTN','dataAirtel','dataTelecel','dataAFA','dataVouchers'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.classList.add('hidden');
  });
  const target=document.getElementById(targetId);
  if(target) target.classList.remove('hidden');
}
function toggleAdmin(){const p=document.getElementById('adminPanel');p.classList.toggle('hidden');if(!p.classList.contains('hidden'))loadAdminData();}
function loadAdminData(){const c=KRATIS_CONFIG.contact;document.getElementById('editContact').innerHTML=`CEO: ${KRATIS_CONFIG.ceo}<br><input id="eP1" value="${c.phone1}" class="w-full p-1 rounded text-black text-xs mb-1">`;document.getElementById('editMTN').innerHTML=KRATIS_CONFIG.prices.dataBundles.MTN.slice(0,8).map((b,i)=>`<div class="flex gap-1"><span class="text-[10px] w-8">${b.size}</span><input data-mtn-price="${i}" value="${b.price}" class="w-16 p-1 rounded text-black text-xs"></div>`).join('');document.getElementById('editEstate').innerHTML=KRATIS_CONFIG.prices.estate.slice(0,5).map((e,i)=>`<div class="flex gap-1"><span class="text-[9px] w-16">${e.title.substring(0,12)}</span><input data-est-price="${i}" value="${e.price}" class="w-20 p-1 rounded text-black text-xs"></div>`).join('');document.getElementById('editAgents').innerHTML=KRATIS_CONFIG.agents.map(a=>`<div class="border-b border-slate-700 pb-1"><b>${a.name}</b><br>${a.role}<br>${a.phone}</div>`).join('');}
function saveContact(){const p1=document.getElementById('eP1');if(p1)KRATIS_CONFIG.contact.phone1=p1.value;renderAll();alert('Saved!');}
function savePrices(){document.querySelectorAll('[data-mtn-price]').forEach(inp=>{KRATIS_CONFIG.prices.dataBundles.MTN[inp.getAttribute('data-mtn-price')].price=parseFloat(inp.value);});renderAll();}
function saveEstate(){document.querySelectorAll('[data-est-price]').forEach(inp=>{KRATIS_CONFIG.prices.estate[inp.getAttribute('data-est-price')].price=parseInt(inp.value);});renderAll();}
function renderAll(){
  const c=KRATIS_CONFIG.contact;const wa=c.whatsapp;
  document.getElementById('waHeader').href=`https://wa.me/${wa}`;
  const makeEstateCard=(e)=>`<div class="bg-white rounded-2xl shadow overflow-hidden"><div class="relative h-52"><img src="${e.image}" class="w-full h-full object-cover"><div class="absolute top-2 left-2 bg-[#8B0000] text-white px-2.5 py-1 rounded-full text-[10px] font-bold">${e.location}</div></div><div class="p-4"><h3 class="font-bold text-sm">${e.title}</h3><div class="mt-2"><span class="font-black text-[#8B0000]">${e.currency} ${e.price.toLocaleString()}</span></div><div class="mt-3 flex gap-2"><a href="https://wa.me/${wa}?text=Interested in ${encodeURIComponent(e.title)}" target="_blank" class="flex-1 bg-green-500 text-white text-center py-2.5 rounded-full text-xs font-bold">WhatsApp</a><button class="flex-1 border py-2.5 rounded-full text-xs">Details</button></div></div></div>`;
  const eg=document.getElementById('estateGrid'); if(eg) eg.innerHTML=KRATIS_CONFIG.prices.estate.slice(0,3).map(makeEstateCard).join('');
  const elg=document.getElementById('estateListGrid'); if(elg) elg.innerHTML=KRATIS_CONFIG.prices.estate.map(makeEstateCard).join('');
  const makeBlog=(b)=>`<div class="bg-white rounded-xl shadow overflow-hidden"><img src="${b.image}" class="h-44 w-full object-cover"><div class="p-4"><span class="bg-slate-900 text-white px-2 py-1 rounded-full text-[9px]">${b.category}</span><h3 class="font-bold text-[14px] mt-2">${b.title}</h3><p class="text-[12px] text-slate-500 mt-1">${b.excerpt}</p></div></div>`;
  const bie=document.getElementById('blogInsideEstate'); if(bie) bie.innerHTML=KRATIS_CONFIG.blogs.slice(0,6).map(makeBlog).join('');
  const bg=document.getElementById('blogsGrid'); if(bg) bg.innerHTML=KRATIS_CONFIG.blogs.map(makeBlog).join('');
  const makeAgent=(a)=>`<div class="bg-white rounded-xl shadow p-4 flex gap-3"><img src="${a.image}" class="w-14 h-14 rounded-full"><div><div class="font-bold text-sm">${a.name}</div><div class="text-[11px]">${a.role}</div><div class="text-[11px] mt-1">${a.phone}</div></div></div>`;
  const ag=document.getElementById('agentsGrid'); if(ag) ag.innerHTML=KRATIS_CONFIG.agents.map(makeAgent).join('');
  const makeBundle=(b)=>`<div class="bg-[#1A1A22] border border-slate-800 p-4 rounded-xl"><div class="flex justify-between"><div><div class="font-bold text-yellow-400">${b.size}</div><div class="text-[11px] text-slate-400">${b.validity}</div></div><div class="text-right"><div class="font-black">GHS ${b.price}</div><button class="mt-1 bg-yellow-400 text-black px-3 py-1 rounded-full text-[10px] font-bold">Buy Now</button></div></div></div>`;
  const mg=document.getElementById('mtnGrid'); if(mg) mg.innerHTML=KRATIS_CONFIG.prices.dataBundles.MTN.map(makeBundle).join('');
  const makeAT=(b)=>`<div class="bg-[#1A1A22] border border-slate-800 p-4 rounded-xl"><div class="font-bold text-sky-400">${b.size}</div><div class="text-[11px]">${b.validity}</div><div class="mt-2 font-black">GHS ${b.price}</div><button class="mt-2 w-full bg-sky-500 py-1.5 rounded-full text-xs">Buy Now</button></div>`;
  const atg=document.getElementById('atGrid'); if(atg) atg.innerHTML=KRATIS_CONFIG.prices.dataBundles.AirtelTigo.map(makeAT).join('');
  const makeTel=(b)=>`<div class="bg-[#1A1A22] border border-slate-800 p-4 rounded-xl"><div class="font-bold text-red-400">${b.size}</div><div class="text-[11px]">${b.validity}</div><div class="mt-2 font-black">GHS ${b.price}</div><button class="mt-2 w-full bg-red-600 py-1.5 rounded-full text-xs">Buy Now</button></div>`;
  const tg=document.getElementById('telGrid'); if(tg) tg.innerHTML=KRATIS_CONFIG.prices.dataBundles.Telecel.map(makeTel).join('');
}
document.addEventListener('DOMContentLoaded',()=>{
  renderAll();
  showPage('flights');
  document.querySelectorAll('#dataSidebar button').forEach(btn=>{
    btn.addEventListener('click',()=>{ 
      const sec=btn.getAttribute('data-sec');
      showDataSection(sec);
    });
  });
});
</script></body></html>
